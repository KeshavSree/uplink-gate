[project]
name = "uplink-gate"
version = "0.1.0"
description = "Blocks an Fpy sequence from being uplinked unless it was compiled with the dictionary of the flight software build the vehicle is actually running."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Keshav Sreekantham" }]
dependencies = [
    "fprime-fpy==0.6.0",
    "sqlalchemy>=2.0,<2.1",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Everything the gate service needs on top of the core library and CLI.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fprime-gds==4.3.1",
    "psycopg[binary]>=3.2",
    "influxdb-client>=1.40",
]

[project.scripts]
gate = "cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate", "cli", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the demo vehicles from `docker compose up` (deselected by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["gate", "cli", "api"]
ignore_missing_imports = true
check_untyped_defs = true
